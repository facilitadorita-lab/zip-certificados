name: Keep Supabase active
# Validação automática após atualização dos secrets do Render e GitHub.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keepalive.yml"
  schedule:
    # 07:10 no horario de Brasilia (UTC-3).
    - cron: "10 10 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Acordar DLT
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          echo "Aquecendo o serviço DLT..."
          curl --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            https://certificados-dlt.onrender.com/status-publico || true
          sleep 10
          for tentativa in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 30 --max-time 180 \
              -H "X-Automation-Secret: ${AUTOMATION_SECRET}" \
              https://certificados-dlt.onrender.com/keepalive; then
              exit 0
            fi
            echo "DLT ainda acordando; nova tentativa em 20 segundos..."
            sleep 20
          done
          exit 1

      - name: Acordar DLH
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
        run: |
          echo "Aquecendo o serviço DLH..."
          curl --silent --show-error --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            https://certificados-dlh.onrender.com/dlh/status-publico || true
          sleep 10
          for tentativa in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 30 --max-time 180 \
              -H "X-Automation-Secret: ${AUTOMATION_SECRET}" \
              https://certificados-dlh.onrender.com/dlh/keepalive; then
              exit 0
            fi
            echo "DLH ainda acordando; nova tentativa em 20 segundos..."
            sleep 20
          done
          exit 1
